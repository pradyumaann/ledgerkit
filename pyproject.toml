[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerkit"
version = "0.1.0"
description = "Open-source, self-hosted ERP core with a tool layer built for Claude"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.1"]
mcp = ["mcp>=2.0"]

[project.scripts]
ledgerkit = "ledgerkit.adapters.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/ledgerkit/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI and Typer declare dependencies and options as call defaults.
ignore = ["B008"]
